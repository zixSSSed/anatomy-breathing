<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дыхательная система</title>
<meta name="description" content="3D-модель дыхательных путей и лёгких, конспект, лекции, схемы, тест на 140 вопросов, карточки и билеты по темам 4.1–4.2">
<link rel="icon" type="image/png" href="%BASE_URL%icons/favicon-64.png">
<link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
<link rel="manifest" href="%BASE_URL%manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Дыхание">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F3F4FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D18" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=Literata:ital,opsz,wght@1,7..72,400..500&display=swap">
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add("js");
    try {
      var t = localStorage.getItem("resp-theme"); if (t) d.dataset.theme = t;
      if (localStorage.getItem("resp-glass") === "on") d.dataset.glass = "on";
      if (localStorage.getItem("resp-motion") === "reduce") d.dataset.motion = "reduce";
    } catch (e) {}
    if (navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)) d.classList.add("standalone");
  })();
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--vein)"/><stop offset="1" stop-color="var(--artery)"/></linearGradient>
  <linearGradient id="traceGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--vein)"/><stop offset=".55" stop-color="#9B53C9"/><stop offset="1" stop-color="var(--artery)"/></linearGradient>
</defs></svg>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Для работы сайта нужен JavaScript.</p></noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
